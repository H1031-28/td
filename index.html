<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="无限塔防">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>无限塔防</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
canvas{
  display:block;touch-action:none;
  height:100vh;width:calc(100vh * 9 / 16);
  max-width:100vw;max-height:calc(100vw * 16 / 9);
}
</style>
</head>
<body>
<canvas id="c" width="720" height="1280"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.scale(2,2);
const W = 360, H = 640;

const PATH = [
  {x:-20,y:80},{x:280,y:80},{x:280,y:240},{x:80,y:240},
  {x:80,y:420},{x:320,y:420},{x:320,y:600},{x:180,y:600}
];
const SPOTS = [
  [140,40],[220,140],[140,320],[220,380],[40,240],
  [340,380],[260,520],[120,460],[260,200],[40,420]
];

let gold,hp,wave,active,wtimer,queue,enemies,towers,bullets,over,msg,msgT,last;

function reset(){
  gold=100;hp=10;wave=0;active=false;wtimer=1;
  queue=[];enemies=[];towers=[];bullets=[];
  over=false;msg='';msgT=0;last=0;
}
function setMsg(t,d){msg=t;msgT=d||0.9;}

function startWave(){
  wave++;active=true;
  const n=3+Math.floor(wave*1.2);
  const hb=20*Math.pow(1.16,wave-1);
  const rb=6*Math.pow(1.18,wave-1);
  const sp=30+Math.min(50,wave*0.5);
  for(let i=0;i<n;i++)queue.push({d:i*0.8,hp:hb*(1+0.08*i),r:rb,s:sp});
}

function update(dt){
  if(over)return;
  if(msgT>0){msgT-=dt;if(msgT<=0)msg='';}

  if(!active){
    wtimer-=dt;
    if(wtimer<=0)startWave();
  }else{
    for(let i=queue.length-1;i>=0;i--){
      queue[i].d-=dt;
      if(queue[i].d<=0){
        const q=queue[i];
        enemies.push({pi:0,x:PATH[0].x,y:PATH[0].y,hp:q.hp,mhp:q.hp,s:q.s,r:q.r,rad:8});
        queue.splice(i,1);
      }
    }
    if(queue.length===0&&enemies.length===0){
      active=false;wtimer=2.5;
      const bonus=Math.floor(30*Math.pow(1.18,wave-1));
      gold+=bonus;
      setMsg('第'+wave+'波完成 +'+bonus,1.5);
    }
  }

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i],t=PATH[e.pi+1];
    if(!t){hp--;enemies.splice(i,1);if(hp<=0){hp=0;over=true;}continue;}
    const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy);
    if(d<=e.s*dt){e.x=t.x;e.y=t.y;e.pi++;}
    else{e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt;}
  }

  for(const t of towers){
    t.cd-=dt;
    if(t.cd<=0){
      let tg=null,mi=-1;
      for(const e of enemies){
        if(Math.hypot(e.x-t.x,e.y-t.y)<=t.range&&e.pi>mi){mi=e.pi;tg=e;}
      }
      if(tg){bullets.push({x:t.x,y:t.y,tg,dmg:t.dmg,s:220});t.cd=1/t.rate;}
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(enemies.indexOf(b.tg)<0){bullets.splice(i,1);continue;}
    const dx=b.tg.x-b.x,dy=b.tg.y-b.y,d=Math.hypot(dx,dy);
    if(d<=b.s*dt+5){
      b.tg.hp-=b.dmg;
      if(b.tg.hp<=0){gold+=b.tg.r;enemies.splice(enemies.indexOf(b.tg),1);}
      bullets.splice(i,1);
    }else{
      b.x+=dx/d*b.s*dt;b.y+=dy/d*b.s*dt;
    }
  }
}

function draw(){
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);

  ctx.strokeStyle='#4a4a6a';ctx.lineWidth=30;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(PATH[0].x,PATH[0].y);
  for(let i=1;i<PATH.length;i++)ctx.lineTo(PATH[i].x,PATH[i].y);
  ctx.stroke();

  ctx.fillStyle='#ff6b6b';ctx.beginPath();ctx.arc(180,600,16,0,7);ctx.fill();
  ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.arc(180,584,8,0,7);ctx.fill();

  for(const s of SPOTS){
    const has=towers.some(t=>t.x===s[0]&&t.y===s[1]);
    ctx.fillStyle=has?'#2ecc71':'#555';
    ctx.beginPath();ctx.arc(s[0],s[1],15,0,7);ctx.fill();
  }

  for(const t of towers){
    ctx.strokeStyle='rgba(52,152,219,0.18)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,7);ctx.stroke();
    ctx.fillStyle='#3498db';ctx.beginPath();ctx.arc(t.x,t.y,12,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
    ctx.fillText(t.lv,t.x,t.y+3.5);
  }

  for(const e of enemies){
    ctx.fillStyle='#e74c3c';
    ctx.beginPath();ctx.arc(e.x,e.y,e.rad,0,7);ctx.fill();
    ctx.fillStyle='#000';ctx.fillRect(e.x-10,e.y-16,20,4);
    ctx.fillStyle='#0f0';ctx.fillRect(e.x-10,e.y-16,20*Math.max(0,e.hp/e.mhp),4);
  }

  for(const b of bullets){
    ctx.fillStyle='#f1c40f';
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();
  }

  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
  ctx.fillText('金币 '+Math.floor(gold),12,24);
  ctx.fillText('波次 '+wave,12,46);
  ctx.fillText('萝卜 '+hp,12,68);

  if(msg){
    ctx.fillStyle='#f1c40f';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(msg,180,100);
  }

  if(over){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font='bold 30px sans-serif';ctx.fillText('游戏结束',180,280);
    ctx.font='18px sans-serif';ctx.fillText('到达波次 '+wave,180,320);
    ctx.fillStyle='#f1c40f';ctx.fillText('点击屏幕重新开始',180,365);
  }
}

function loop(t){
  if(!last)last=t;
  let dt=(t-last)/1000;last=t;
  if(dt>0.05)dt=0.05;
  update(dt);draw();
  requestAnimationFrame(loop);
}

function handleTap(x,y){
  if(over){reset();return;}
  let spot=null;
  for(const s of SPOTS){
    if(Math.hypot(s[0]-x,s[1]-y)<26){spot=s;break;}
  }
  if(!spot)return;
  const tw=towers.find(t=>t.x===spot[0]&&t.y===spot[1]);
  if(!tw){
    if(gold>=30){
      gold-=30;
      towers.push({x:spot[0],y:spot[1],lv:1,cd:0,dmg:10,range:70,rate:1});
      setMsg('建造炮塔');
    }else setMsg('金币不足');
  }else{
    const cost=Math.floor(30*Math.pow(1.18,tw.lv-1));
    if(gold>=cost){
      gold-=cost;tw.lv++;
      tw.dmg=10*Math.pow(1.15,tw.lv-1);
      tw.range=70+tw.lv*2;
      tw.rate=1+tw.lv*0.02;
      setMsg('升到 '+tw.lv+' 级');
    }else setMsg('需要 '+cost+' 金币');
  }
}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width);
  const y=(e.clientY-r.top)*(H/r.height);
  handleTap(x,y);
},{passive:false});

reset();
requestAnimationFrame(loop);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
